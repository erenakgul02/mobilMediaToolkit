name: Android APK Derleme ve Yayinlama

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Android APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bagimliliklari Yukle
        run: |
          cd mobile
          npm install

      - name: Expo Prebuild
        run: |
          cd mobile
          npx expo prebuild --platform android --no-install

      - name: HTTP Cleartext Trafik Yetkisi Ekle
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' mobile/android/app/src/main/AndroidManifest.xml || true

      - name: Gradlew Dosyasini Yetkilendir
        run: |
          chmod +x mobile/android/gradlew

      - name: Android APK Derle (assembleDebug)
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: APK Dosyasini Hazirla
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobilMediaToolkit.apk || cp mobile/android/app/build/outputs/apk/debug/*.apk mobilMediaToolkit.apk

      - name: APK Dosyasini Yukle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: MediaToolkit-APK
          path: mobilMediaToolkit.apk

      - name: GitHub Releases Uzerinde Yayinla
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "Mobil Media Toolkit v1.0.0"
          body: "Android cihazlar icin optimize edilmis, dogrudan yuklenebilir APK dosyasidir."
          draft: false
          prerelease: false
          make_latest: true
          files: mobilMediaToolkit.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

