name: Android APK Derleme ve Yayinlama

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Android APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Java JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Kurulumu
        uses: android-actions/setup-android@v3

      - name: Bagimliliklari Yukle
        run: |
          cd mobile
          npm install

      - name: Prebuild & Android Derleme
        run: |
          cd mobile
          npx expo prebuild --platform android
          cd android
          ./gradlew assembleRelease

      - name: APK Dosyasini Artifact Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: MediaToolkit-Android-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk
