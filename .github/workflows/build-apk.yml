name: Android APK Derleme ve Yayinlama

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Android APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bagimliliklari Yukle
        run: |
          cd mobile
          npm install

      - name: Expo Prebuild
        run: |
          cd mobile
          npx expo prebuild --platform android --no-install

      - name: Gradlew Dosyasini Yetkilendir
        run: |
          chmod +x mobile/android/gradlew

      - name: Android APK Derle (assembleDebug)
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: APK Dosyasini Yukle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: MediaToolkit-APK
          path: mobile/android/app/build/outputs/apk/debug/*.apk
